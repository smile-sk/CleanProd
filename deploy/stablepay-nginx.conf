# Stablecoin Payment API - фронт через nginx на VPS.
# DNS: A-запись pay.apiteka.pp.ua -> IP VPS (добавить у регистратора).
# TLS: после первого запуска: certbot --nginx -d pay.apiteka.pp.ua

server {
    listen 80;
    server_name pay.apiteka.pp.ua;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
