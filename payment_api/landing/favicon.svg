<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#131e3a"/>
      <stop offset="1" stop-color="#070b16"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2ecc8f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2ecc8f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="rgba(120,150,210,.28)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="25" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="12.5" fill="#2ecc8f">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#2ecc8f" stroke-opacity="0.45" stroke-width="1.6">
    <animate attributeName="r" values="15;21;15" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;0.05;0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>